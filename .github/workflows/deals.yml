name: Saudi Deals Hunter

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: Send Telegram test message
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: saudi-deals-hunter
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Discover potential offers
        env:
          DEAL_FEED_URLS: ${{ vars.DEAL_FEED_URLS }}
        run: python discover.py
      - name: Run deal checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: python deals.py

      - name: Save deal history
        if: success()
        run: |
          if [ ! -f seen.json ]; then
            echo "No deal history to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json

          if git diff --cached --quiet; then
            echo "No new history."
            exit 0
          fi

          git commit -m "Update Saudi Deals Hunter history"
          git push origin HEAD:main
