
name: Saudi Deals Hunter

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send Telegram test message"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deal checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: python deals.py
